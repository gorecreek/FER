name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        If you are able to recreate an issue please do so with the config option enableItemDebugLogging enabled.
        This will output tons of information in the server log and help me a lot.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked that there are no existing issue like this
          required: true
        - label: I am using the latest version of the mod
          required: true
        - label: I have Softcore or Safe Exit in SVM disabled
          required: true
        - label: I have wipeOnRaidStart false in ./SPT_Data/configs/lostondeath.json
          required: true

  - type: input
    id: spt-version
    attributes:
      label: SPT Version
      description: What is your SPT version?
      placeholder: "e.g., 4.0.11"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Also what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The more detailed this is the better.
      placeholder: |
        1. Enter [map]
        2. Do something
        3. Die
        4. Observe incorrect behavior

  - type: textarea
    id: serverlog
    attributes:
      label: Server Log
      description: |
        Upload or paste the contents of your server log file located in `SPT/user/logs/` that is the most recent.
        If it doesn't fit or you don't want to paste the whole file you can paste just the portion of the log related to the mod.
      placeholder: "Paste log contents or drag & drop the file..."
      render: text
    validations:
      required: true

  - type: textarea
    id: modconfig
    attributes:
      label: Mod config
      description: |
        Upload or paste the contents of your config file located in `SPT/user/mods/gorecreek-FairEquipmentRestoration`
      placeholder: "Paste log contents or drag & drop the file..."
      render: text
    validations:
      required: true

  - type: textarea
    id: svmpreset
    attributes:
      label: (Optional) SVM preset
      description: |
        Upload or paste the contents of your current preset file located in `SPT/user/mods/[SVM] Server Value Modifier/Presets`
      placeholder: "Paste log contents or drag & drop the file..."
      render: text
    validations:
      required: false